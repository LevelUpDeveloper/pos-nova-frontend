<div>
  <p class="text-[64px] font-extrabold leading-none tracking-tight tabular-nums">{{ time() }}</p>
  <p class="mt-2 text-[15px] font-medium text-muted-2">{{ longDate() }}</p>
</div>

<div class="mt-4 rounded-[20px] border border-white/10 bg-white/5 p-5 backdrop-blur">
  <p class="font-mono text-[11px] font-bold uppercase tracking-[0.2em] text-muted">Sucursal</p>
  <p class="mt-2 text-lg font-bold">{{ branchName() }}</p>
  <dl class="mt-3 grid gap-2 text-sm">
    <div class="flex items-center justify-between">
      <dt class="flex items-center gap-2 text-muted">
        <i class="bi bi-pc-display-horizontal" aria-hidden="true"></i>Caja
      </dt>
      <dd class="font-mono font-bold">{{ registerName() }}</dd>
    </div>
    <div class="flex items-center justify-between">
      <dt class="flex items-center gap-2 text-muted">
        <i class="bi bi-wifi" aria-hidden="true"></i>Conexión
      </dt>
      <dd class="font-semibold" [class]="online() ? 'text-success-soft' : 'text-danger'">
        {{ online() ? 'Estable' : 'Sin conexión' }}
      </dd>
    </div>
  </dl>
</div>

<div class="mt-4 rounded-[20px] border border-violet-soft/30 bg-violet/15 p-5">
  <p
    class="flex items-center gap-2 font-mono text-[11px] font-bold uppercase tracking-[0.2em] text-violet-pale"
  >
    <i class="bi bi-megaphone-fill" aria-hidden="true"></i>Aviso del día
  </p>
  <p class="mt-2 text-[15px] leading-relaxed text-muted-3">{{ notice() }}</p>
</div>
