<div
  class="dot-grid relative h-[380px] overflow-hidden rounded-2xl bg-black/20 ring-1 ring-white/10"
>
  @for (coin of coins(); track coin.id + '-' + coin.round) {
    <button
      type="button"
      aria-label="Atrapar moneda"
      class="coin-face absolute -top-10 grid size-[38px] place-items-center rounded-full font-mono text-base font-extrabold motion-safe:animate-fall motion-reduce:top-1/3"
      [class.invisible]="coin.hidden"
      [style.left.%]="coin.left"
      [style.animation-duration.s]="coin.duration"
      [style.animation-delay.s]="coin.delay"
      [style.animation-play-state]="frozen() ? 'paused' : 'running'"
      (click)="catchCoin(coin)"
      (animationiteration)="dropped(coin)"
    >
      $
    </button>
  }

  <!-- Caja registradora decorativa -->
  <div class="pointer-events-none absolute inset-x-6 bottom-0 z-10" aria-hidden="true">
    <div class="mx-auto h-5 w-24 rounded-t-md bg-[#2e2a63] ring-1 ring-white/10">
      <div class="mx-auto h-1.5 w-12 translate-y-1.5 rounded bg-success-soft/70"></div>
    </div>
    <div
      class="flex h-16 items-center justify-center rounded-t-xl bg-linear-to-b from-[#3a3478] to-[#221e52] ring-1 ring-white/10"
    >
      <span class="font-mono text-sm font-extrabold tracking-[0.3em] text-violet-pale">NOVA</span>
    </div>
  </div>

  @if (!running()) {
    @if (lost()) {
      <app-game-overlay
        heading="¡Se cayó una moneda!"
        [message]="'Atrapaste ' + score() + (score() === 1 ? ' moneda' : ' monedas')"
        cta="Jugar otra vez"
        (action)="start()"
      />
    } @else {
      <app-game-overlay
        heading="Atrapa las monedas"
        message="Tócalas antes de que lleguen al fondo. Si se cae una, pierdes."
        cta="Empezar"
        (action)="start()"
      />
    }
  }
</div>

<div class="mt-3 flex gap-2">
  <button
    type="button"
    [class]="btnGhost"
    class="flex-1"
    [disabled]="!running()"
    (click)="togglePause()"
  >
    @if (manualPause()) {
      <i class="bi bi-play-fill" aria-hidden="true"></i> Continuar
    } @else {
      <i class="bi bi-pause-fill" aria-hidden="true"></i> Pausar
    }
  </button>
  <button type="button" [class]="btnGhost" class="flex-1" [disabled]="!running()" (click)="start()">
    <i class="bi bi-arrow-counterclockwise" aria-hidden="true"></i> Reiniciar
  </button>
</div>
