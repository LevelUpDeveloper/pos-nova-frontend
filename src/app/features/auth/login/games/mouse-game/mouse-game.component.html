<app-round-timer [remaining]="round.remaining()" [seconds]="round.seconds" />

<div class="relative mt-3 rounded-xl">
  <div class="grid grid-cols-3 gap-2.5">
    @for (box of boxes; track box) {
      <button
        type="button"
        class="relative h-[84px] overflow-hidden rounded-lg border-2 border-cardboard-edge bg-linear-to-b from-[#d4a568] to-[#b98949]"
        [attr.aria-label]="box === mouseAt() ? '¡Ratón! Atrápalo' : 'Caja ' + (box + 1)"
        (click)="hit(box)"
      >
        <span class="absolute inset-x-0 top-[38%] h-3 bg-[#e6c491]/70" aria-hidden="true"></span>
        @if (box === mouseAt()) {
          <span class="absolute inset-x-0 bottom-0 flex justify-center motion-safe:animate-pop">
            <svg viewBox="0 0 64 56" class="h-[58px] w-16" aria-hidden="true">
              <circle cx="14" cy="16" r="11" fill="#9aa1ba" />
              <circle cx="14" cy="16" r="6.5" fill="#f9a8d4" />
              <circle cx="50" cy="16" r="11" fill="#9aa1ba" />
              <circle cx="50" cy="16" r="6.5" fill="#f9a8d4" />
              <ellipse cx="32" cy="34" rx="20" ry="18" fill="#b9bfd3" />
              <circle cx="24" cy="31" r="3" fill="#141832" />
              <circle cx="40" cy="31" r="3" fill="#141832" />
              <circle cx="25" cy="30" r="1" fill="#fff" />
              <circle cx="41" cy="30" r="1" fill="#fff" />
              <ellipse cx="32" cy="41" rx="4" ry="3" fill="#f472b6" />
              <path
                d="M18 40h-9M18 44l-8 3M46 40h9M46 44l8 3"
                stroke="#6b7194"
                stroke-width="1.5"
                stroke-linecap="round"
              />
            </svg>
          </span>
        }
      </button>
    }
  </div>

  @if (!running()) {
    @if (finished()) {
      <app-game-overlay
        heading="¡Tiempo!"
        [message]="'Atrapaste ' + score() + (score() === 1 ? ' ratón' : ' ratones')"
        cta="Jugar otra vez"
        (action)="start()"
      />
    } @else {
      <app-game-overlay
        heading="Saca al ratón"
        message="Atrápalo antes de que cambie de caja. Rondas de {{ round.seconds }} s."
        cta="Empezar"
        (action)="start()"
      />
    }
  }
</div>
