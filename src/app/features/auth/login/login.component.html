<div class="login-container">

    <form class="login-card" (ngSubmit)="onLogin()">

        <div class="login-header">
            <i class="bi bi-shop login-logo"></i>
            <h1>NOVA</h1>
            <p>Inicia sesión para continuar</p>
        </div>

        <div class="form-group">

            <label for="email">
                <i class="bi bi-envelope"></i>
                Correo electrónico
            </label>

            <input
                id="email"
                type="email"
                placeholder="ejemplo@dominio.com"
                [(ngModel)]="email"
                name="email"
            >

        </div>

        <div class="form-group">

            <label for="password">
                <i class="bi bi-key-fill"></i>   
                Contraseña
            </label>

            <input
                id="password"
                type="password"
                placeholder="Contraseña"
                [(ngModel)]="password"
                name="password"
            >

        </div>

        <button type="submit">
            Iniciar sesión
        </button>

        <div *ngIf="errorMessage" class="error-message">
            {{ errorMessage }}
        </div>

    </form>

</div>
