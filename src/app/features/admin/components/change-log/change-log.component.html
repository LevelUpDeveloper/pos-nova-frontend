<section class="drop-shadow-[0_24px_30px_rgb(0_0_0/0.45)]" [attr.aria-label]="text.title">
  <!-- Impresora (decorativa) -->
  <div
    class="relative z-10 rounded-[20px] bg-linear-to-b from-[#2e2a63] via-[#1f1c4a] to-[#141236] p-3 pb-5 ring-1 ring-white/10"
    aria-hidden="true"
  >
    <div class="flex items-center justify-between px-1">
      <span class="font-mono text-[10px] uppercase tracking-[0.25em] text-muted">{{ text.printer }}</span>
      <span class="size-1.5 rounded-full bg-success shadow-[0_0_8px_2px_rgb(34_197_94/0.6)]"></span>
    </div>
    <div class="absolute inset-x-4 bottom-2.5 h-2 rounded-full bg-black/80"></div>
  </div>

  <div class="-mt-3 overflow-hidden px-3">
    <div class="ticket-edge paper-lines bg-paper px-5 pb-8 pt-6 text-paper-ink motion-safe:animate-print">
      <div class="text-center font-mono text-[11px] uppercase tracking-[0.18em] text-slate-500">
        <h2 class="font-bold text-paper-ink">{{ text.title }}</h2>
        <p>{{ text.subtitle(branchName()) }}</p>
      </div>
      <div class="my-3 border-t-2 border-dashed border-slate-300" aria-hidden="true"></div>

      @if (entries().length) {
        <ol class="flex flex-col gap-3 text-[13px]">
          @for (entry of entries(); track $index) {
            <li class="flex gap-3">
              <time class="shrink-0 font-mono text-[11px] text-slate-500" [attr.datetime]="entry.at">{{ timeOf(entry) }}</time>
              <span><b>{{ entry.actor }}</b> {{ entry.action }}</span>
            </li>
          }
        </ol>
      } @else {
        <p class="text-center text-[13px] text-slate-500">{{ text.empty }}</p>
      }

      <div class="my-3 border-t-2 border-dashed border-slate-300" aria-hidden="true"></div>
      <button
        type="button"
        aria-disabled="true"
        [title]="comingSoon()"
        class="block w-full cursor-not-allowed text-center text-[13px] font-bold text-violet-deep"
      >
        {{ text.seeAll }} →
      </button>
      <div class="barcode mx-auto mt-3 h-7 w-[78%]" aria-hidden="true"></div>
    </div>
  </div>
</section>
