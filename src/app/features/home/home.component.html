<div
  class="grid flex-1 items-center gap-10 py-2 lg:grid-cols-2 xl:grid-cols-[minmax(0,1fr)_minmax(0,380px)_minmax(0,290px)] 2xl:grid-cols-[minmax(0,1fr)_400px_300px]"
>
  <app-sales-summary
    class="motion-safe:animate-enter lg:col-span-2 xl:col-span-1"
    [greeting]="greeting()"
    [summary]="summary"
    [trendSlots]="trendSlots"
  />
  <app-recent-tickets
    class="motion-safe:animate-enter [animation-delay:.08s]"
    [tickets]="summary.recentTickets"
    [limit]="ticketsShown"
  />
  <app-quick-actions
    class="motion-safe:animate-enter [animation-delay:.16s]"
    [actions]="actions"
    [notice]="notice"
  />
</div>
