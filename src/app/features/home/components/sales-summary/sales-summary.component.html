<p class="text-[15px] font-medium text-muted-2">{{ greeting() }}</p>

<h1 class="mt-6 font-mono text-[11px] font-bold uppercase tracking-[0.3em] text-muted short:mt-4">
  {{ text.soldLabel }}
</h1>
<p
  class="mt-2 font-mono text-[clamp(44px,5.6vw,84px)] font-extrabold leading-none tracking-tight tabular-nums text-gold [text-shadow:0_0_40px_rgb(255_210_122/0.25)]"
>
  {{ total().whole }}<span class="text-[0.48em] text-gold/60">{{ total().cents }}</span>
</p>

@if (trend(); as t) {
  @if (t.last; as last) {
    <svg
      class="mt-6 h-20 w-full max-w-[520px] overflow-visible short:mt-4 short:h-16"
      [attr.viewBox]="'0 0 ' + chart.width + ' ' + chart.height"
      preserveAspectRatio="none"
      role="img"
      [attr.aria-label]="text.trendLabel"
    >
      <defs>
        <linearGradient id="home-trend-fill" x1="0" x2="0" y1="0" y2="1">
          <stop offset="0" stop-color="var(--color-violet)" stop-opacity=".45" />
          <stop offset="1" stop-color="var(--color-violet)" stop-opacity="0" />
        </linearGradient>
      </defs>
      <path [attr.d]="t.area" fill="url(#home-trend-fill)" />
      <polyline
        [attr.points]="t.line"
        fill="none"
        stroke="var(--color-violet-pale)"
        stroke-width="3"
        stroke-linejoin="round"
        stroke-linecap="round"
        vector-effect="non-scaling-stroke"
      />
      <line
        [attr.x1]="last.x"
        [attr.x2]="chart.width"
        [attr.y1]="last.y"
        [attr.y2]="last.y"
        stroke="var(--color-muted)"
        stroke-opacity=".3"
        stroke-dasharray="4 6"
        vector-effect="non-scaling-stroke"
      />
      <circle [attr.cx]="last.x" [attr.cy]="last.y" r="6" fill="var(--color-gold)" />
    </svg>
  }
}

<dl class="mt-8 flex flex-wrap gap-x-8 gap-y-4 short:mt-6">
  <div>
    <dt class="font-mono text-[11px] font-bold uppercase tracking-[0.2em] text-muted">{{ text.ticketsLabel }}</dt>
    <dd class="mt-1 font-mono text-[26px] font-extrabold tabular-nums">{{ summary().ticketCount }}</dd>
  </div>
  <div>
    <dt class="font-mono text-[11px] font-bold uppercase tracking-[0.2em] text-muted">{{ text.averageLabel }}</dt>
    <dd class="mt-1 font-mono text-[26px] font-extrabold tabular-nums">{{ average() }}</dd>
  </div>
  <div>
    <dt class="font-mono text-[11px] font-bold uppercase tracking-[0.2em] text-muted">{{ text.lowStockLabel }}</dt>
    <dd class="mt-1 font-mono text-[26px] font-extrabold tabular-nums text-danger">{{ summary().lowStockCount }}</dd>
  </div>
</dl>
