<h2 class="sr-only">{{ text.quickActionsLabel }}</h2>
<ul class="flex flex-col gap-3">
  @for (item of actions(); track item.id) {
    <li>
      <app-nav-action [item]="item" [comingSoon]="text.comingSoon" [baseClass]="itemClass(item)">
        <i [class]="iconClass(item)" aria-hidden="true"></i>
        <span class="min-w-0 flex-1">
          <span [class]="item.tone === 'primary' ? 'block text-[18px] font-extrabold' : 'block font-bold'">{{ item.label }}</span>
          @if (item.description) {
            <span class="block text-[12px] text-white/80">{{ item.description }}</span>
          }
        </span>
        @if (item.shortcut) {
          <kbd
            class="font-mono"
            [class]="
              item.tone === 'primary'
                ? 'rounded-md bg-black/25 px-2 py-0.5 text-[12px] font-bold'
                : 'text-[11px] text-muted'
            "
            >{{ item.shortcut }}</kbd
          >
        }
      </app-nav-action>
    </li>
  }
</ul>

<aside class="mt-5 rounded-[18px] border border-violet-soft/30 bg-violet/15 p-4">
  <p class="flex items-center gap-2 font-mono text-[11px] font-bold uppercase tracking-[0.2em] text-violet-pale">
    <i class="bi bi-megaphone-fill" aria-hidden="true"></i>{{ text.noticeLabel }}
  </p>
  <p class="mt-1.5 text-[13px] leading-relaxed text-muted-3">{{ notice() }}</p>
</aside>
